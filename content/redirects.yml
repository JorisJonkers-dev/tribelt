- { from: /en/transportbanden, to: /en/metal-conveyor-belts }
- { from: /en/kenniscentrum, to: /en/knowledge-center }
- { from: /en/nieuws, to: /en/news }
- { from: /en/over-ons, to: /en/about-us }
- { from: /en/privacyverklaring, to: /en/privacy-statement }
