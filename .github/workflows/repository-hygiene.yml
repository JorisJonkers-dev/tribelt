name: 'Repository Hygiene'

'on':
  pull_request:

'concurrency':
  'group': '${{ github.workflow }}-${{ github.ref }}'
  'cancel-in-progress': '${{ github.ref != ''refs/heads/main'' }}'

permissions:
  contents: 'read'
  pull-requests: 'read'

jobs:
  repository-hygiene:
    uses: 'JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@16d241e44f03c5cc4696d2d0de615717a61ef3c0' # v0.36.0
    secrets: 'inherit'
