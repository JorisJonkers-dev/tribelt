name: 'Repository Hygiene'

'on':
  pull_request:

'concurrency':
  'group': '${{ github.workflow }}-${{ github.ref }}'
  'cancel-in-progress': '${{ github.ref != ''refs/heads/main'' }}'

permissions:
  contents: 'read'
  pull-requests: 'read'

jobs:
  repository-hygiene:
    uses: 'JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@f2180a482b63756affde537233881fa12e65df70' # v0.35.0
    secrets: 'inherit'
