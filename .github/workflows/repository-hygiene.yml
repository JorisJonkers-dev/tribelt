name: 'Repository Hygiene'

'on':
  pull_request:

'concurrency':
  'group': '${{ github.workflow }}-${{ github.ref }}'
  'cancel-in-progress': '${{ github.ref != ''refs/heads/main'' }}'

permissions:
  contents: 'read'
  pull-requests: 'read'

jobs:
  repository-hygiene:
    uses: 'JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@f3bb6cabaa6ee33694f8632ce273a4e703d60780' # v0.38.0
    secrets: 'inherit'
