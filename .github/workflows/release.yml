# release-please keeps a release PR open; merging it tags vX.Y.Z with the App token,
# and that tag push triggers publish.yml. A GITHUB_TOKEN tag would trigger nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: mint-app-token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: assert-token-minted
        # Fail loudly if the App token is missing — never fall back to GITHUB_TOKEN.
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "E_APP_TOKEN_MISSING: Release App token was not minted." >&2
            echo "Secrets RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY must be configured." >&2
            echo "GITHUB_TOKEN fallback is intentionally forbidden." >&2
            exit 1
          fi
          echo "App token minted successfully (token prefix: ${APP_TOKEN:0:4}...)"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
