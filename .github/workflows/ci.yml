# One pipeline ending in "Pipeline Complete", the only required check (estate convention).
# GitHub bills each job rounded up to a full minute, so checks are steps of one job, not jobs. The
# Playwright smoke test is the exception: it runs in the Playwright image, which carries the
# browsers and their system packages, so no run waits on apt to install them.
# Steps run `task` targets so CI and `task check` cannot drift, and carry
# `if: ${{ !cancelled() }}` so one failure still surfaces the rest.
name: CI

on:
  # synchronize re-runs the Content Release gate when release-please (App token) updates its PR.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the Content Release gate diffs against the base branch and the latest tag
          fetch-tags: true

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: true

      - name: Format
        if: ${{ !cancelled() }}
        run: task fmt

      - name: Lint Go
        if: ${{ !cancelled() }}
        run: task lint:go

      - name: Lint migrations (squawk)
        if: ${{ !cancelled() }}
        run: task lint:sql

      - name: Lint workflows
        if: ${{ !cancelled() }}
        run: task lint:actions

      - name: Generated code is current
        if: ${{ !cancelled() }}
        run: task gen:check

      - name: Vet
        if: ${{ !cancelled() }}
        run: task vet

      - name: Test (race, Postgres, route manifest, SEO lint, verbatim) and coverage
        if: ${{ !cancelled() }}
        run: task test

      - name: Classifier coverage is 100%
        if: ${{ !cancelled() }}
        run: task test:visits

      # Always runs: the script itself enforces on release-please--* heads and only annotates elsewhere,
      # so no `if:` can skip the enforcing check and leave Pipeline Complete green.
      - name: Content Release gate (enforced on the release PR)
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          HEAD_REF: ${{ github.head_ref }}
        run: task release-gate

      - name: Build
        if: ${{ !cancelled() }}
        run: task build

      - name: Secret scan
        if: ${{ !cancelled() }}
        run: task secrets

      - name: Container image builds
        if: ${{ !cancelled() }}
        run: docker build --build-arg VERSION=ci -t tribelt:ci .

  # The binary the smoke test runs, and the Playwright version tests/e2e's lockfile resolves, so the
  # smoke test's image always carries the browsers that version expects, also after Renovate bumps it.
  e2e-build:
    name: End-to-end build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version="$(jq -r '.packages["node_modules/@playwright/test"].version // empty' tests/e2e/package-lock.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no @playwright/test version in tests/e2e/package-lock.json" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: true

      - name: Build
        run: task build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-binary
          path: bin/tribelt
          retention-days: 1

  # Eight tests: one job, no shards. Postgres is a service container, reached by its name; the image
  # brings node and npm, so the job needs no mise.
  e2e:
    name: Beacon smoke test (Playwright)
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.e2e-build.outputs.playwright }}-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tribelt
          POSTGRES_PASSWORD: tribelt
          POSTGRES_DB: tribelt_db
        options: >-
          --health-cmd "pg_isready -U tribelt -d tribelt_db"
          --health-interval 2s
          --health-retries 30
    env:
      # Firefox refuses a HOME the container's root user does not own.
      HOME: /root
      DATABASE_URL: postgres://tribelt:tribelt@postgres:5432/tribelt_db?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-binary
          path: bin

      # An artifact does not keep the file mode.
      - run: chmod +x bin/tribelt

      # `task e2e` without its compose Postgres and build; the image already holds Chromium.
      - name: Beacon smoke test
        run: scripts/e2e.sh

      - name: Turn the blob report into HTML
        if: ${{ !cancelled() }}
        working-directory: tests/e2e
        run: npx playwright merge-reports --reporter html blob-report

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  pipeline-complete:
    name: Pipeline Complete
    if: ${{ always() }}
    needs: [check, e2e-build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a job ended ${result}"; exit 1; }
          done
