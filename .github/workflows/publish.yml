# Tag-triggered publish flow.
#
# push of a v*.*.* tag (authored by release.yml via the App token) drives:
#   publish-image -> resolve-image-lock -> fragment (the estate path)
#
# The image lock crosses the reusable-workflow boundary as an UPLOADED ARTIFACT, never a
# runner-local path. The image embeds content/, so every Content Release needs a new tag.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  # -- 1. Build and push the multi-arch container image ----------------------
  publish-image:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@2814b76fc3f5bd4f02a6e4a0fa789f1307757daa # v0.45.4
    with:
      image-name: tribelt
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      platforms: linux/amd64,linux/arm64
      require-package-proxy: true
    permissions:
      contents: read
      packages: write
    secrets:
      PACKAGES_PROXY_TOKEN: ${{ secrets.PACKAGES_PROXY_TOKEN }}

  # -- 2. Resolve the image lock (upload artifact, never path) --------------
  resolve-image-lock:
    needs: [publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      fragment-images-lock-artifact: fragment-images-lock-${{ github.run_id }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # The commit the release was cut from, so the fragment names it however publish was started.
      - name: source-commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: check-image-platforms
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/jorisjonkers-dev/tribelt
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "E_FLOATING_IMAGE: could not resolve a digest for ${IMAGE}:${TAG}" >&2
            exit 1
          fi
          platforms="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r '[.manifests[]?.platform | "\(.os)/\(.architecture)"] | join(",")')"
          case "$platforms" in
            *linux/amd64*linux/arm64*|*linux/arm64*linux/amd64*) echo "Platforms: $platforms" ;;
            *) echo "E_SINGLE_ARCH: expected linux/amd64 and linux/arm64, got '$platforms'" >&2; exit 1 ;;
          esac

      # The estate path's images lock share: this release's image, under the alias the project file names,
      # with the user the image runs as and the version it ships, read back from what was pushed.
      - name: lock-fragment-image
        uses: JorisJonkers-dev/github-workflows/actions/resolve-image-lock@2814b76fc3f5bd4f02a6e4a0fa789f1307757daa # v0.45.4
        with:
          name: tribelt
          images: |
            tribelt
          tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          artifact-name: fragment-images-lock-${{ github.run_id }}

  # -- 3. The Intent Fragment: the project file and its images lock share, pushed,
  # signed and verified, then composition started in JorisJonkers-dev/estate.
  fragment:
    needs: [resolve-image-lock]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: JorisJonkers-dev/github-workflows/.github/workflows/publish-fragment.yml@2814b76fc3f5bd4f02a6e4a0fa789f1307757daa # v0.45.4
    with:
      project-file: deploy/tribelt.project.yml
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      ref: ${{ needs.resolve-image-lock.outputs.source-sha }}
      validate-with: deploy/env
      validate-with-fragments: auth
      images-lock-artifact: ${{ needs.resolve-image-lock.outputs.fragment-images-lock-artifact }}
      require-package-proxy: true
    secrets:
      ESTATE_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.ESTATE_DISPATCH_APP_PRIVATE_KEY }}
      PACKAGES_PROXY_TOKEN: ${{ secrets.PACKAGES_PROXY_TOKEN }}
