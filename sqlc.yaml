version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: queries
        out: internal/platform/pg/queries
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: date
            go_type: time.Time
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
